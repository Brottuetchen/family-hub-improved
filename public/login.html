<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05050c">
  <title>Anmelden · Hermes Family OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hermes">
  <link rel="apple-touch-icon" href="/assets/icons/app-icon-192.png">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <div class="logo-lg">☿</div>
      <h1>Hermes Family OS</h1>
      <p class="sub">Das Betriebssystem eurer Familie</p>

      <div class="error-msg" id="error"></div>

      <div class="field">
        <label for="username">Benutzername</label>
        <input class="input" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit" id="submit">Anmelden</button>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
