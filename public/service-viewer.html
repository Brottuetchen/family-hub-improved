<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Service Viewer - Family Hub</title>
    <meta name="theme-color" content="#4A46E4">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .service-viewer {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height für mobile */
        }

        .service-viewer__header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #4A46E4, #714CFF);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 70, 228, 0.3);
            position: relative;
            z-index: 100;
            /* iOS Safe Area Support */
            padding-top: max(12px, env(safe-area-inset-top));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 14px;
        }

        .back-btn:hover,
        .back-btn:focus {
            background: rgba(255, 255, 255, 0.35);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        #serviceTitle {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .reload-btn {
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
        }

        .reload-btn:hover,
        .reload-btn:focus {
            background: rgba(255, 255, 255, 0.35);
        }

        .reload-btn svg {
            width: 20px;
            height: 20px;
        }

        #serviceFrame {
            flex: 1;
            border: none;
            width: 100%;
            background: white;
        }

        .loading-overlay {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(241, 243, 251, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(74, 70, 228, 0.2);
            border-top-color: #4A46E4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .error-message h2 {
            margin: 0 0 12px;
            color: #e74c3c;
        }

        .error-message p {
            margin: 0 0 16px;
            color: #525a75;
        }
    </style>
</head>
<body>
    <div class="service-viewer">
        <header class="service-viewer__header">
            <button onclick="goBack()" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Zurück
            </button>
            <h1 id="serviceTitle">Lädt...</h1>
            <button onclick="reloadService()" class="reload-btn" aria-label="Neu laden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
            </button>
        </header>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>

        <div class="error-message" id="errorMessage">
            <h2>Fehler beim Laden</h2>
            <p id="errorText"></p>
            <button onclick="reloadService()" class="btn btn--primary">Erneut versuchen</button>
        </div>

        <iframe id="serviceFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script src="service-viewer.js"></script>
</body>
</html>
