<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Push Setup - Family Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: #f5f5f5;
        }
        h1 { margin-bottom: 20px; color: #333; }
        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status { padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007aff;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { opacity: 0.7; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .back-link {
            display: inline-block;
            margin: 20px 0;
            color: #007aff;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Push-Benachrichtigungen</h1>

    <div class="card">
        <h3>Status</h3>
        <div id="status" class="status info">Bereit zum Einrichten...</div>
    </div>

    <div class="card">
        <button id="btn-setup">Push-Benachrichtigungen aktivieren</button>
        <button id="btn-test" disabled>Test-Push senden</button>
    </div>

    <a href="/" class="back-link">Zurueck zur App</a>

    <script>
    const API_URL = window.location.origin;

    function showStatus(msg, type) {
        const status = document.getElementById('status');
        status.className = 'status ' + (type || 'info');
        status.innerHTML = '<strong>' + msg + '</strong>';
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }

    async function checkSubscription() {
        try {
            const registration = await navigator.serviceWorker.ready;
            const subscription = await registration.pushManager.getSubscription();

            if (subscription) {
                showStatus('Push-Benachrichtigungen sind AKTIV', 'success');
                document.getElementById('btn-test').disabled = false;
                document.getElementById('btn-setup').disabled = true;
                document.getElementById('btn-setup').textContent = 'Bereits aktiviert';
                return true;
            } else {
                showStatus('Push-Benachrichtigungen sind nicht aktiviert', 'info');
                return false;
            }
        } catch (error) {
            showStatus('Fehler: ' + error.message, 'error');
            return false;
        }
    }

    document.getElementById('btn-setup').onclick = async () => {
        try {
            showStatus('Aktiviere Push...', 'info');

            const permission = await Notification.requestPermission();

            if (permission !== 'granted') {
                showStatus('Berechtigung wurde abgelehnt', 'error');
                return;
            }

            const vapidResp = await fetch(API_URL + '/api/vapid-public-key');
            const data = await vapidResp.json();

            const registration = await navigator.serviceWorker.ready;
            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(data.publicKey)
            });

            await fetch(API_URL + '/api/push/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(subscription.toJSON())
            });

            showStatus('Push-Benachrichtigungen aktiviert!', 'success');
            document.getElementById('btn-test').disabled = false;
            document.getElementById('btn-setup').disabled = true;
            document.getElementById('btn-setup').textContent = 'Bereits aktiviert';

        } catch (error) {
            showStatus('Fehler: ' + error.message, 'error');
        }
    };

    document.getElementById('btn-test').onclick = async () => {
        try {
            const resp = await fetch(API_URL + '/api/push/notify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: 'Family Hub Test',
                    body: 'Test - ' + new Date().toLocaleTimeString(),
                    url: '/'
                })
            });

            const result = await resp.json();
            showStatus('Test gesendet! ' + result.success + ' erfolgreich', 'success');
        } catch (error) {
            showStatus('Fehler: ' + error.message, 'error');
        }
    };

    window.addEventListener('load', async () => {
        try {
            await navigator.serviceWorker.register('/service-worker.js');
            await navigator.serviceWorker.ready;
            await checkSubscription();
        } catch (error) {
            showStatus('Service Worker Fehler: ' + error.message, 'error');
        }
    });
    </script>
</body>
</html>
