<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f1a" media="(prefers-color-scheme: dark)">
  <title>Hermes Family OS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <!-- iOS: als eigenständige App zum Home-Bildschirm hinzufügbar -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hermes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/icons/app-icon-192.png">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">☿</span>
        <span>Hermes<small>Family OS</small></span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btn-search" title="Suche">🔍</button>
      <button class="icon-btn" id="btn-theme" title="Design wechseln">🌓</button>
      <button class="icon-btn primary" id="btn-ai" title="Hermes AI">✨</button>
      <button class="avatar" id="btn-profile" title="Profil">?</button>
    </header>

    <section class="greeting">
      <h1 id="greeting">Willkommen</h1>
      <div class="date" id="date"></div>
    </section>

    <nav class="nav" id="nav"></nav>

    <main id="view"></main>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
