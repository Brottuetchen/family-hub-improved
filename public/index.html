<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Hermes Family OS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="apple-touch-icon" href="/assets/icons/app-icon-192.png">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">☿</span>
        <span>Hermes<small>Family OS</small></span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btn-search" title="Suche">🔍</button>
      <button class="icon-btn" id="btn-theme" title="Design wechseln">🌓</button>
      <button class="icon-btn primary" id="btn-ai" title="Hermes AI">✨</button>
      <button class="avatar" id="btn-profile" title="Profil">?</button>
    </header>

    <section class="greeting">
      <h1 id="greeting">Willkommen</h1>
      <div class="date" id="date"></div>
    </section>

    <nav class="nav" id="nav"></nav>

    <main id="view"></main>
  </div>

  <!-- AI Panel -->
  <div class="overlay" id="overlay"></div>
  <aside class="ai-panel" id="ai-panel" aria-label="Hermes AI">
    <div class="ai-head">
      <span class="logo">☿</span>
      <div>
        <div style="font-weight:700">Hermes AI</div>
        <div style="font-size:12px;color:var(--text-faint)" id="ai-mode">Assistent</div>
      </div>
      <div class="spacer" style="flex:1"></div>
      <button class="icon-btn" id="ai-close">✕</button>
    </div>
    <div class="ai-msgs" id="ai-msgs"></div>
    <div class="chips" id="ai-chips"></div>
    <div class="ai-input">
      <input class="input" id="ai-text" placeholder="Frag Hermes … z.B. „Bestell Milch“" autocomplete="off">
      <button class="icon-btn primary" id="ai-send">➤</button>
    </div>
  </aside>

  <div class="toasts" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
