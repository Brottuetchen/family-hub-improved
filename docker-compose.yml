# Hermes Family OS — Docker Compose
# Startet Backend (inkl. Frontend), PostgreSQL und Redis.
# Konfiguration über .env (siehe .env.example).

services:
  hermes:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Überschreibt DATABASE_URL/REDIS_URL für den Container-Verbund
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@db:5432/${POSTGRES_DB:-hermes}
      REDIS_URL: redis://redis:6379/0
      # Verweist auf den optionalen hermes-agent-Sidecar (nur relevant, wenn
      # AI_PROVIDER=hermes_agent). Harmlos, wenn der Sidecar nicht läuft.
      HERMES_AGENT_URL: ${HERMES_AGENT_URL:-http://hermes-agent:8890/v1}
      HERMES_AGENT_DASHBOARD_URL: ${HERMES_AGENT_DASHBOARD_URL:-http://hermes-agent:9119}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - hermes_redis:/data

  # Optionaler lokaler LLM-Server für Hermes AI (Nous Hermes u.a.).
  # Aktivieren mit:  docker compose --profile ai up -d
  # Danach Modell laden:  docker compose exec ollama ollama pull hermes3
  # In der .env setzen:
  #   AI_PROVIDER=local
  #   AI_BASE_URL=http://ollama:11434/v1
  #   AI_MODEL=hermes3
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - hermes_ollama:/root/.ollama
    # Für NVIDIA-GPU zusätzlich (Host mit nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]

  # NousResearch/hermes-agent als Sidecar — das echte, komplette KI-Gehirn
  # (Skills/Selbstlernen, Memory, 40+ Tools, Subagents, Voice, Abo-Logins).
  # Aktivieren:  docker compose --profile agent up -d
  # WICHTIG (ehrlich): hermes-agent ist groß (~610 MB) und sehr aktiv.
  #  * PINNE eine feste Version und richte dich nach dessen offizieller Doku:
  #    https://github.com/NousResearch/hermes-agent  ·  hermes-agent.nousresearch.com
  #  * Setze HERMES_AGENT_IMAGE auf ein veröffentlichtes Image ODER ersetze
  #    'image:' durch einen 'build:'-Block, der das gepinnte Repo baut.
  #  * Start-Befehl/Ports ('command'/expose) ggf. an die gepinnte Version anpassen.
  #  * Einmaliger Login danach (Codex/ChatGPT-Abo oder Nous Portal):
  #      docker compose exec hermes-agent hermes auth add openai --type device-code
  #      docker compose exec hermes-agent hermes setup --portal
  #    Details: docs/HERMES_AGENT.md
  hermes-agent:
    image: ${HERMES_AGENT_IMAGE:-nousresearch/hermes-agent:latest}
    profiles: ["agent"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - hermes_agent_home:/root/.hermes   # Config + Credential-Pool (Login) – persistent
    expose:
      - "9119"   # Web-Dashboard (über unseren Reverse-Proxy /agent erreichbar)
      - "8890"   # OpenAI-kompatibler API-Server (Port ggf. anpassen)
    # command: ["hermes", "dashboard", "--host", "0.0.0.0", "--no-open"]  # per gepinnter Version

volumes:
  hermes_pgdata:
  hermes_redis:
  hermes_ollama:
  hermes_agent_home:
