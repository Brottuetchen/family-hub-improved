# Hermes Family OS — Docker Compose
# Startet Backend (inkl. Frontend), PostgreSQL und Redis.
# Konfiguration über .env (siehe .env.example).

services:
  hermes:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Überschreibt DATABASE_URL/REDIS_URL für den Container-Verbund
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@db:5432/${POSTGRES_DB:-hermes}
      REDIS_URL: redis://redis:6379/0
      # Verweist auf den optionalen hermes-agent-Sidecar (nur relevant, wenn
      # AI_PROVIDER=hermes_agent). Harmlos, wenn der Sidecar nicht läuft.
      HERMES_AGENT_URL: ${HERMES_AGENT_URL:-http://hermes-agent:8642/v1}
      HERMES_AGENT_DASHBOARD_URL: ${HERMES_AGENT_DASHBOARD_URL:-}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - hermes_redis:/data

  # NousResearch/hermes-agent als Sidecar — das echte, komplette KI-Gehirn
  # (Skills/Selbstlernen, Memory, 40+ Tools, Subagents, Voice, Abo-Logins).
  # Aktivieren:  docker compose --profile agent up -d --build
  #
  # Es gibt (Stand jetzt) KEIN offizielles Image -> wir BAUEN aus dem Repo
  # (Dockerfile ist vorhanden). WICHTIG: den Git-Ref unten auf eine feste
  # Version PINNEN (das Repo ist sehr aktiv). Der Build ist groß (~610 MB).
  #
  # Bestätigt aus dem Upstream-Repo:
  #  * Der OpenAI-kompatible API-Server (gateway/platforms/api_server.py) ist eine
  #    GATEWAY-PLATTFORM (APIServerAdapter) -> Start über 'hermes gateway', NICHT 'serve'.
  #      POST /v1/chat/completions (SSE), /v1/models …  – Default 127.0.0.1:8642
  #      -> API_SERVER_HOST=0.0.0.0, API_SERVER_PORT=8642, Bearer=API_SERVER_KEY
  #    Die 'api'-Plattform muss aktiv sein (einmalig via 'hermes gateway setup',
  #    persistiert im Volume). Prüfe am gepinnten Stand: 'hermes gateway --help'.
  #  * Daten/Config-Volume: /opt/data (HERMES_HOME)
  #  * Setup/Login (einmalig, interaktiv):
  #      docker compose exec hermes-agent hermes setup            # Wizard (Codex/ChatGPT-Abo)
  #      docker compose exec hermes-agent hermes setup --portal   # Nous Portal
  #      docker compose exec hermes-agent hermes gateway setup    # 'api'-Plattform aktivieren
  #      docker compose exec hermes-agent hermes mcp add hermes-family \
  #        --transport streamable-http --url http://hermes-mcp:8765/mcp
  #  * Web-Dashboard: 'hermes dashboard' (Port/Existenz je nach Version prüfen).
  hermes-agent:
    image: hermes-agent-local:pinned
    build:
      # Git-Ref auf einen festen Commit GEPINNT (Repo ist sehr aktiv). Zum Wechseln
      # den SHA/Tag hinter '#' ändern und mit '--build' neu bauen.
      context: "https://github.com/NousResearch/hermes-agent.git#4075c8fd5ade673c93f757903b003ddc52603577"
    profiles: ["agent"]
    restart: unless-stopped
    env_file: .env
    environment:
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_AGENT_TOKEN:-}
      HERMES_HOME: /opt/data
    volumes:
      - hermes_agent_home:/opt/data   # Config + Credential-Pool (Login) – persistent
    expose:
      - "8642"   # OpenAI-kompatibler API-Server (unser Relay: HERMES_AGENT_URL=…:8642/v1)
    # Startet den Gateway-Runner (hostet die 'api'-Plattform = OpenAI-API auf 8642).
    command: ["gateway"]
    # Health = API-Server antwortet auf /v1/models (python ist im Image vorhanden).
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request as u; k=os.environ.get('API_SERVER_KEY') or ''; h={'Authorization':'Bearer '+k} if k else {}; u.urlopen(u.Request('http://127.0.0.1:8642/v1/models', headers=h), timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # MCP-Server: gibt hermes-agent Zugriff auf unsere Haushalts-Werkzeuge
  # (Einkauf, Kalender, Licht, Finanzen, Wartung, Essensplan …).
  # In hermes-agent einen MCP-Server hinzufügen, der auf
  #   http://hermes-mcp:8765/mcp   (Streamable HTTP) zeigt.  Siehe docs/HERMES_AGENT.md
  hermes-mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["agent"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@db:5432/${POSTGRES_DB:-hermes}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
    command: ["python", "-m", "app.mcp.server"]
    expose:
      - "8765"
    depends_on:
      db:
        condition: service_healthy

volumes:
  hermes_pgdata:
  hermes_redis:
  hermes_agent_home:
